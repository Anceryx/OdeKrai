[package]
name = "odekrai"
version = "0.1.0"
description = "OdeKrai para Windows"
authors = ["Anceryx"]
license = "MIT"
edition = "2021"

[features]
diagnostics = ["tauri/devtools"]
mock-window-tests = []

[lib]
name = "odekrai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[test]]
name = "mock_window"
path = "tests/mock_window.rs"
required-features = ["mock-window-tests"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[dependencies]
base64 = "0.22"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
log = "0.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tokio = { version = "1", features = ["macros", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_Time"] }
windows = { version = "0.62", features = ["Win32_Graphics_Dxgi", "Win32_System_SystemInformation"] }

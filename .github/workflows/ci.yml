name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-validation:
    name: Validação e pacote Windows
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7.0.1

      - name: Configurar Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Configurar Rust estável
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Instalar dependências JavaScript
        run: npm ci

      - name: Executar testes
        run: npm test

      - name: Verificar formatação
        run: npm run format:check

      - name: Compilar a interface
        run: npm run build

      - name: Gerar instalador NSIS
        run: npm run tauri:build

      - name: Armazenar instalador como artefato
        uses: actions/upload-artifact@v7.0.2
        with:
          name: odekrai-windows-x64-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
